    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior: smooth; }
      body { font-family: 'Noto Sans', sans-serif; }
      .font-adlam { font-family: 'ADLaM Display', cursive; }
      /* Fade-in animation for landing page sections */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-up    { animation: fadeUp 0.6s ease-out both; }
      .animate-fade-up-d1 { animation-delay: 0.1s; }
      .animate-fade-up-d2 { animation-delay: 0.2s; }
      .animate-fade-up-d3 { animation-delay: 0.3s; }
      .animate-fade-up-d4 { animation-delay: 0.4s; }
      .animate-fade-up-d5 { animation-delay: 0.5s; }
    </style>

      }
